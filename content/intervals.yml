slug: intervals
part: patterns
position: 16
title: Intervals
blurb: |
  Sort by start, then sweep. Nearly every interval question — merge, insert, count
  overlaps, fit meetings into rooms — is that sort followed by one linear pass
  comparing each interval to the one you are currently holding.
snippets:
  - slug: merge-intervals
    title: Merge overlapping intervals
    time: O(n log n)
    space: O(n)
    notes: |
      Sorting by start is what makes a single pass sufficient: once ordered, an
      interval can only ever overlap the one immediately before it. Note `>=` —
      whether [1,2] and [2,3] touch or merge is a question worth asking out loud.
    code: |
      def merge_intervals(intervals)
        intervals.sort_by(&:first).each_with_object([]) do |(start, finish), merged|
          if merged.any? && start <= merged.last[1]
            merged.last[1] = [merged.last[1], finish].max
          else
            merged << [start, finish]
          end
        end
      end

      p merge_intervals([[1, 3], [2, 6], [8, 10], [15, 18]])
      p merge_intervals([[1, 4], [4, 5]])
      p merge_intervals([])
    expected: |
      [[1, 6], [8, 10], [15, 18]]
      [[1, 5]]
      []

  - slug: insert-interval
    title: Insert into a sorted interval list
    time: O(n)
    space: O(n)
    notes: |
      Already sorted, so no sort is needed — three passes suffice: everything
      strictly before, the run that overlaps (absorbed into one), then everything
      strictly after. Sorting here would be the O(n log n) answer to an O(n) question.
    code: |
      def insert_interval(intervals, fresh)
        before = intervals.take_while { |_s, e| e < fresh[0] }
        after  = intervals.drop_while { |s, _e| s <= fresh[1] }
        overlapping = intervals[before.size...(intervals.size - after.size)]

        merged = overlapping.empty? ? fresh
                                    : [[fresh[0], overlapping.first[0]].min,
                                       [fresh[1], overlapping.last[1]].max]

        before + [merged] + after
      end

      p insert_interval([[1, 3], [6, 9]], [2, 5])
      p insert_interval([[1, 2], [3, 5], [6, 7], [8, 10], [12, 16]], [4, 8])
      p insert_interval([], [5, 7])
      p insert_interval([[1, 5]], [6, 8])
    expected: |
      [[1, 5], [6, 9]]
      [[1, 2], [3, 10], [12, 16]]
      [[5, 7]]
      [[1, 5], [6, 8]]

  - slug: meeting-rooms
    title: Minimum meeting rooms
    time: O(n log n)
    space: O(n)
    notes: |
      Forget which meeting is which. Sort the starts and the ends separately and
      sweep: a start before the next end needs a new room, otherwise a room frees
      up. The peak concurrency is the answer.
    code: |
      def min_rooms(meetings)
        starts = meetings.map(&:first).sort
        ends = meetings.map(&:last).sort

        rooms = peak = 0
        finished = 0

        starts.each do |start|
          while finished < ends.size && ends[finished] <= start
            rooms -= 1
            finished += 1
          end
          rooms += 1
          peak = [peak, rooms].max
        end

        peak
      end

      p min_rooms([[0, 30], [5, 10], [15, 20]])
      p min_rooms([[7, 10], [2, 4]])
      p min_rooms([[1, 5], [2, 6], [3, 7]])
      p min_rooms([])
    expected: |
      2
      1
      3
      0
