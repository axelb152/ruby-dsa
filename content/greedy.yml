title: Greedy
blurb: |
  Take the locally best option and never reconsider. That is only correct when you
  can argue no earlier choice needs revisiting — so the interesting part of a
  greedy answer is always the justification, not the code.
snippets:
  - slug: kadane
    title: Maximum subarray (Kadane's algorithm)
    time: O(n)
    space: O(1)
    notes: |
      At each element, either extend the running sum or start fresh from here. The
      justification: a prefix with a negative sum can never help what follows it, so
      discarding it costs nothing.
    code: |
      def max_subarray(nums)
        return 0 if nums.empty?

        best = running = nums.first
        nums.drop(1).each do |n|
          running = [n, running + n].max
          best = [best, running].max
        end
        best
      end

      p max_subarray([-2, 1, -3, 4, -1, 2, 1, -5, 4])
      p max_subarray([-3, -1, -2])
      p max_subarray([])
    expected: |
      6
      -1
      0
