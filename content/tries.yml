slug: tries
part: patterns
position: 8
title: Tries
blurb: |
  A tree keyed by character. Lookup costs the length of the word rather than the
  size of the dictionary, and — unlike a Hash of whole words — it answers prefix
  questions, which is the only reason to prefer one.
snippets:
  - slug: prefix-tree
    title: Prefix tree with a nested Hash
    time: O(len) per operation
    space: O(total characters)
    notes: |
      A trie is just nested Hashes. An auto-vivifying default block builds the path
      as you walk it, so insert is a `reduce`; a sentinel key marks a complete word,
      which is what distinguishes `search` from `starts_with?`.
    code: |
      TERMINAL = :end

      def build_trie(words)
        root = {}
        words.each do |word|
          node = word.each_char.reduce(root) { |n, c| n[c] ||= {} }
          node[TERMINAL] = true
        end
        root
      end

      def walk(root, prefix)
        prefix.each_char.reduce(root) { |node, c| node && node[c] }
      end

      def search(root, word) = !!walk(root, word)&.key?(TERMINAL)
      def starts_with?(root, prefix) = !walk(root, prefix).nil?

      trie = build_trie(%w[apple app apply])

      p search(trie, "app")
      p search(trie, "appl")
      p starts_with?(trie, "appl")
      p starts_with?(trie, "banana")
    expected: |
      true
      false
      true
      false

  - slug: longest-common-prefix
    title: Longest common prefix
    time: O(total characters)
    space: O(1) for the idiomatic version
    notes: |
      A trie is the textbook answer — walk down while each node has exactly one
      child and no word ends. But for one query, comparing the lexicographic min
      and max is enough: every other string lies between them, so their shared
      prefix is shared by all.
    code: |
      def longest_common_prefix(words)
        return "" if words.empty?

        first, last = words.minmax
        length = first.each_char.zip(last.each_char).take_while { |a, b| a == b }.size
        first[0, length]
      end

      p longest_common_prefix(%w[flower flow flight])
      p longest_common_prefix(%w[dog racecar car])
      p longest_common_prefix(%w[interspecies interstellar interstate])
      p longest_common_prefix([])
      p longest_common_prefix(%w[alone])
    expected: |
      "fl"
      ""
      "inters"
      ""
      "alone"

  - slug: replace-words
    title: Replace words with their shortest root
    time: O(total characters)
    space: O(roots)
    notes: |
      The canonical use of a trie: walk each word down the tree and stop at the
      first node marking a complete root. A Hash of roots would need you to try
      every prefix length separately; the trie finds the shortest in one descent.
    code: |
      TERMINAL = :end

      def build_trie(roots)
        roots.each_with_object({}) do |root, trie|
          node = root.each_char.reduce(trie) { |n, c| n[c] ||= {} }
          node[TERMINAL] = true
        end
      end

      def shortest_root(trie, word)
        node = trie
        word.each_char.with_index do |c, i|
          node = node[c]
          return nil unless node
          return word[0..i] if node[TERMINAL]
        end
        nil
      end

      def replace_words(roots, sentence)
        trie = build_trie(roots)
        sentence.split.map { |w| shortest_root(trie, w) || w }.join(" ")
      end

      p replace_words(%w[cat bat rat], "the cattle was rattled by the battery")
      p replace_words(%w[a aa aaa], "a aa aaa aaaa")
      p replace_words([], "nothing changes here")
    expected: |
      "the cat was rat by the bat"
      "a a a a"
      "nothing changes here"
