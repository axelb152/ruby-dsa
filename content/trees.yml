slug: trees
part: patterns
position: 7
title: Trees
blurb: |
  Recursion is the natural shape: solve for the children, combine. Reach for an
  explicit queue only when the question is genuinely about levels — breadth-first
  order is the one thing recursion does not give you for free.
snippets:
  - slug: traversals-and-depth
    title: Traversals, depth, and level order
    time: O(n)
    space: O(h) recursive, O(w) for BFS
    notes: |
      In-order on a BST yields sorted values, which is the property most BST
      questions hinge on. Level order needs a queue — and taking `queue.size`
      before the inner loop is what keeps each level separate.
    code: |
      Tree = Struct.new(:value, :left, :right)

      def leaf(v) = Tree.new(v, nil, nil)

      root = Tree.new(4,
        Tree.new(2, leaf(1), leaf(3)),
        Tree.new(7, leaf(6), leaf(9)))

      def in_order(node, out = [])
        return out unless node
        in_order(node.left, out)
        out << node.value
        in_order(node.right, out)
      end

      def depth(node)
        node ? 1 + [depth(node.left), depth(node.right)].max : 0
      end

      def level_order(root)
        levels = []
        queue = [root].compact

        until queue.empty?
          levels << queue.map(&:value)
          queue = queue.flat_map { |n| [n.left, n.right] }.compact
        end

        levels
      end

      p in_order(root)
      p depth(root)
      p level_order(root)
      p level_order(nil)
    expected: |
      [1, 2, 3, 4, 6, 7, 9]
      3
      [[4], [2, 7], [1, 3, 6, 9]]
      []

  - slug: validate-bst
    title: Validate a binary search tree
    time: O(n)
    space: O(h)
    notes: |
      Checking each node against only its immediate children is the classic wrong
      answer — it accepts a node deeper in the left subtree that is larger than the
      root. Carry a (low, high) bound down instead, narrowing it at each step.
    code: |
      Tree = Struct.new(:value, :left, :right)
      def leaf(v) = Tree.new(v, nil, nil)

      def valid_bst?(node, low = nil, high = nil)
        return true unless node
        return false if low && node.value <= low
        return false if high && node.value >= high

        valid_bst?(node.left, low, node.value) &&
          valid_bst?(node.right, node.value, high)
      end

      good = Tree.new(5, Tree.new(3, leaf(1), leaf(4)), Tree.new(8, leaf(7), leaf(9)))

      # 6 is larger than the root, but sits in the left subtree — a local check misses it.
      sneaky = Tree.new(5, Tree.new(3, leaf(1), leaf(6)), leaf(8))

      p valid_bst?(good)
      p valid_bst?(sneaky)
      p valid_bst?(nil)
    expected: |
      true
      false
      true

  - slug: invert-and-lca
    title: Invert a tree, and find a lowest common ancestor
    time: O(n)
    space: O(h)
    notes: |
      Inverting is a two-line post-order swap. LCA on a *search* tree is easier than
      the general case: walk down while both targets sit on the same side, and the
      first node that splits them is the answer.
    code: |
      Tree = Struct.new(:value, :left, :right)
      def leaf(v) = Tree.new(v, nil, nil)

      def invert(node)
        return nil unless node
        node.left, node.right = invert(node.right), invert(node.left)
        node
      end

      def in_order(node, out = [])
        return out unless node
        in_order(node.left, out)
        out << node.value
        in_order(node.right, out)
      end

      def lca(node, a, b)
        low, high = [a, b].minmax
        while node
          return node.value if node.value.between?(low, high)
          node = node.value > high ? node.left : node.right
        end
        nil
      end

      tree = Tree.new(5, Tree.new(3, leaf(1), leaf(4)), Tree.new(8, leaf(7), leaf(9)))

      p lca(tree, 1, 4)
      p lca(tree, 1, 9)
      p lca(tree, 7, 9)

      p in_order(invert(tree))
    expected: |
      3
      5
      8
      [9, 8, 7, 5, 4, 3, 1]
