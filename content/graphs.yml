slug: graphs
part: patterns
position: 11
title: Graphs
blurb: |
  A grid is a graph; so is a set of prerequisites. Once you see the adjacency, the
  traversal is mechanical — BFS for fewest steps, DFS for reachability, and a
  visited set in both so you terminate.
snippets:
  - slug: number-of-islands
    title: Number of islands (flood fill)
    time: O(rows · cols)
    space: O(rows · cols) worst case
    notes: |
      Each cell is visited once: the outer loop finds an unvisited land cell, then
      the flood sinks its whole component so it is never counted again. Mutating the
      grid is the standard trick for O(1) extra space — mention it, and ask whether
      mutating the input is acceptable.
    code: |
      def count_islands(grid)
        grid = grid.map(&:dup)

        sink = lambda do |r, c|
          return if r < 0 || c < 0 || r >= grid.size || c >= grid[0].size
          return unless grid[r][c] == "1"
          grid[r][c] = "0"
          [[1, 0], [-1, 0], [0, 1], [0, -1]].each { |dr, dc| sink.call(r + dr, c + dc) }
        end

        count = 0
        grid.each_index do |r|
          grid[r].each_index do |c|
            next unless grid[r][c] == "1"
            count += 1
            sink.call(r, c)
          end
        end
        count
      end

      p count_islands([
        %w[1 1 0 0 0],
        %w[1 1 0 0 0],
        %w[0 0 1 0 0],
        %w[0 0 0 1 1]
      ])
      p count_islands([%w[0 0], %w[0 0]])
    expected: |
      3
      0

  - slug: course-schedule
    title: Course schedule (cycle detection)
    time: O(V + E)
    space: O(V + E)
    notes: |
      Three states, not two. A node being *in progress* is what distinguishes a
      genuine cycle from merely revisiting a node you already finished by another
      route — with a plain visited set, a diamond-shaped DAG reports a false cycle.
    code: |
      def can_finish?(course_count, prerequisites)
        graph = Hash.new { |h, k| h[k] = [] }
        prerequisites.each { |course, needs| graph[course] << needs }

        state = Array.new(course_count, :unvisited)

        walk = lambda do |node|
          return true  if state[node] == :done
          return false if state[node] == :in_progress

          state[node] = :in_progress
          return false unless graph[node].all? { |nxt| walk.call(nxt) }
          state[node] = :done
          true
        end

        (0...course_count).all? { |node| walk.call(node) }
      end

      p can_finish?(2, [[1, 0]])
      p can_finish?(2, [[1, 0], [0, 1]])
      # A diamond: 3 depends on 1 and 2, both of which depend on 0. Not a cycle.
      p can_finish?(4, [[1, 0], [2, 0], [3, 1], [3, 2]])
    expected: |
      true
      false
      true

  - slug: shortest-path-grid
    title: Shortest path through a grid (BFS)
    time: O(rows · cols)
    space: O(rows · cols)
    notes: |
      BFS finds the fewest steps because it visits in order of distance — the first
      time you reach a cell is via a shortest route. Mark cells visited as you
      *enqueue*, not as you dequeue, or the same cell joins the queue many times.
    code: |
      def shortest_path(grid, from, to)
        rows, cols = grid.size, grid.first.size
        queue = [[from, 0]]
        seen = { from => true }

        until queue.empty?
          (cell, steps) = queue.shift
          return steps if cell == to

          r, c = cell
          [[1, 0], [-1, 0], [0, 1], [0, -1]].each do |dr, dc|
            nxt = [r + dr, c + dc]
            next if nxt[0] < 0 || nxt[1] < 0 || nxt[0] >= rows || nxt[1] >= cols
            next if grid[nxt[0]][nxt[1]] == 1 || seen[nxt]
            seen[nxt] = true
            queue << [nxt, steps + 1]
          end
        end

        -1
      end

      maze = [
        [0, 0, 0, 0],
        [1, 1, 0, 1],
        [0, 0, 0, 0],
        [0, 1, 1, 0]
      ]

      p shortest_path(maze, [0, 0], [3, 3])
      p shortest_path(maze, [0, 0], [0, 0])
      p shortest_path([[0, 1], [1, 0]], [0, 0], [1, 1])
    expected: |
      6
      0
      -1
