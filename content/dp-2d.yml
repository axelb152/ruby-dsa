slug: dp-2d
part: patterns
position: 14
title: Dynamic programming — 2D
blurb: |
  Two sequences, so the state is a pair of positions and the table is a grid. Fill
  it so every cell's dependencies are already computed, and read the answer out of
  the far corner.
snippets:
  - slug: lcs-and-edit-distance
    title: Longest common subsequence, and edit distance
    time: O(m · n)
    space: O(m · n)
    notes: |
      Same grid, different recurrence. Matching characters move diagonally; a
      mismatch takes the best neighbour. Edit distance adds one to that best
      neighbour because a mismatch costs an operation rather than merely being
      skipped.
    code: |
      def lcs(a, b)
        table = Array.new(a.size + 1) { Array.new(b.size + 1, 0) }

        a.each_char.with_index(1) do |ca, i|
          b.each_char.with_index(1) do |cb, j|
            table[i][j] = ca == cb ? table[i - 1][j - 1] + 1
                                   : [table[i - 1][j], table[i][j - 1]].max
          end
        end

        table[a.size][b.size]
      end

      def edit_distance(a, b)
        table = Array.new(a.size + 1) { |i| Array.new(b.size + 1) { |j| i.zero? ? j : (j.zero? ? i : 0) } }

        a.each_char.with_index(1) do |ca, i|
          b.each_char.with_index(1) do |cb, j|
            table[i][j] = ca == cb ? table[i - 1][j - 1]
                                   : 1 + [table[i - 1][j], table[i][j - 1], table[i - 1][j - 1]].min
          end
        end

        table[a.size][b.size]
      end

      p lcs("abcde", "ace")
      p lcs("abc", "xyz")
      p edit_distance("horse", "ros")
      p edit_distance("", "abc")
    expected: |
      3
      0
      3
      3

  - slug: knapsack
    title: 0/1 knapsack
    time: O(n · capacity)
    space: O(capacity)
    notes: |
      Each item is taken or not, so unlike coin change the inner loop runs
      **backwards** — otherwise an item updated earlier in the same pass could be
      picked twice, silently turning this into the unbounded version.
    code: |
      def knapsack(weights, values, capacity)
        best = Array.new(capacity + 1, 0)

        weights.each_with_index do |weight, i|
          capacity.downto(weight) do |c|
            best[c] = [best[c], best[c - weight] + values[i]].max
          end
        end

        best[capacity]
      end

      p knapsack([1, 3, 4, 5], [1, 4, 5, 7], 7)
      p knapsack([2], [3], 1)
      p knapsack([], [], 5)
    expected: |
      9
      0
      0

  - slug: grid-paths
    title: Unique paths, and minimum path sum
    time: O(rows · cols)
    space: O(cols)
    notes: |
      Both fill a grid where each cell depends only on the one above and the one to
      the left, so a single row rolling downwards is enough — `row[c]` still holds
      the value from above at the moment you read it.
    code: |
      def unique_paths(rows, cols)
        row = Array.new(cols, 1)
        (rows - 1).times { (1...cols).each { |c| row[c] += row[c - 1] } }
        row.last
      end

      def min_path_sum(grid)
        row = grid.first.each_with_object([]) { |v, acc| acc << v + (acc.last || 0) }

        grid.drop(1).each do |line|
          row[0] += line[0]
          (1...line.size).each { |c| row[c] = line[c] + [row[c], row[c - 1]].min }
        end

        row.last
      end

      p unique_paths(3, 7)
      p unique_paths(1, 1)
      p min_path_sum([[1, 3, 1], [1, 5, 1], [4, 2, 1]])
      p min_path_sum([[1, 2, 3]])
    expected: |
      28
      1
      7
      6
